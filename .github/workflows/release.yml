name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Trakt credentials come from repository secrets: there is no keystore.properties on a
      # runner, and without these the published APK builds fine but ships a dead Trakt pane.
      # Unset (a fork with no secrets), they resolve to empty and the app reports itself
      # unconfigured rather than failing.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEYS: ${{ secrets.TMDB_API_KEYS }}

      - name: Install matching build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Prepare signing credentials
        id: signing
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/build/signing
          valid=false

          if [ -n "$ANDROID_SIGNING_KEY" ]; then
            printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > app/build/signing/release.jks 2>/dev/null || true
            if keytool -list -keystore app/build/signing/release.jks                 -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              valid=true
            fi
          fi

          if [ "$valid" = true ]; then
            {
              echo "SIGNING_KEY_BASE64=$ANDROID_SIGNING_KEY"
              echo "SIGNING_ALIAS=$ANDROID_SIGNING_ALIAS"
              echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using repository release keystore."
          else
            echo "Repository signing secret is missing or invalid; generating a temporary CI signing key."
            keytool -genkeypair -v               -keystore app/build/signing/release.jks               -storetype PKCS12               -alias lumora-ci               -keyalg RSA               -keysize 2048               -validity 3650               -storepass "lumora-ci-store"               -keypass "lumora-ci-key"               -dname "CN=Lumora CI, OU=Build, O=Lumora, L=NA, ST=NA, C=US" >/dev/null 2>&1
            {
              echo "SIGNING_KEY_BASE64=$(base64 -w 0 app/build/signing/release.jks)"
              echo "SIGNING_ALIAS=lumora-ci"
              echo "KEYSTORE_PASSWORD=lumora-ci-store"
              echo "KEY_PASSWORD=lumora-ci-store"
            } >> "$GITHUB_ENV"
          fi

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ env.SIGNING_KEY_BASE64 }}
          alias: ${{ env.SIGNING_ALIAS }}
          keyStorePassword: ${{ env.KEYSTORE_PASSWORD }}
          keyPassword: ${{ env.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename APK
        run: cp "${{ steps.sign_app.outputs.signedReleaseFile }}" app/build/outputs/apk/release/Lumora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-APK
          path: app/build/outputs/apk/release/Lumora.apk
          compression-level: 0

      # Release notes come from the tag's own section of CHANGELOG.md, so a release says
      # what actually changed rather than just "download the APK". The awk block takes
      # everything between this version's "## x.y" heading and the next one; if the tag has
      # no section (or the file is missing), it falls back to a generic body rather than
      # publishing an empty release.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Lumora ${GITHUB_REF_NAME}"
            echo
            awk -v ver="$VERSION" '
              $0 == "## " ver { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Installation"
            echo "Download the APK below and install on your Android TV, Fire TV Stick, or phone."
          } > release-notes.md
          if [ "$(grep -c '[^[:space:]]' release-notes.md)" -le 4 ]; then
            echo "No CHANGELOG entry for $VERSION - using generic notes"
            printf '## Lumora %s\n\n### Installation\nDownload the APK below and install on your Android TV, Fire TV Stick, or phone.\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumora ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/Lumora.apk
